model:
  max_tokens: 4096
  # api_region 控制 DashScope 接入节点：
  #   beijing → 华北2（https://dashscope.aliyuncs.com）    【中国大陆用户使用此项】
  #   intl    → 新加坡（https://dashscope-intl.aliyuncs.com）
  #   us      → 美国（https://dashscope-us.aliyuncs.com）
  # 留空则自动探测可用节点
  # 也可在 .env 中直接设置 DASHSCOPE_BASE_URL 覆盖此配置
  api_region: beijing
  author:
    default_model: qwen3.6-flash
    # ⭐ 推荐主模型：128K上下文，快速低成本，有免费试用额度
    # 其他可选试用模型：qwen3.6-plus, qwen3.6-35b-a3b, glm-5.1
  reviewer:
    default_model: qwen3.6-max-preview
  reader_reviewer:
    default_model: qwen3.6-flash
    enabled: true
    pass_threshold: 75

# ==================== 写作温度配置 ====================
# 各任务类型的 temperature 统一在此管理，无需修改代码
temperature:
  # 创意写作类（章节正文、前半段、后半段）
  writing_main: 0.85      # 大模型一次性生成整章
  writing_first_half: 0.90  # 小模型前半段（略高，给开头更多创意空间）
  writing_second_half: 0.70  # 小模型后半段（略低，保持与前半段连贯）
  writing_supplement: 0.75   # 字数补写

  # 修订类（自检修订、续写衔接）
  revision: 0.70          # 自检修订（有问题时的润色）

  # 质检类（自检判断、JSON 结构化输出）
  self_check: 0.20        # 自检质检（越低越稳定）
  beat_planner: 0.65      # 节拍规划

  # 策划类（大纲、世界观、角色生成）
  outline_gen: 0.90       # 总大纲生成（创意最强）
  world_gen: 0.85         # 世界观生成
  character_extract: 0.50 # 角色名提取（结构化，低温）
  character_gen: 0.70     # 角色档案生成（结构化 JSON，不能太高）
  task_split: 0.70        # 任务卡拆分（结构化 JSON）
  scene_replan: 0.70      # veto 触发后场景重规划

novel:
  chapter_word_target: 3500
  chapter_word_min: 3000
  chapter_word_max: 4000
  max_retry: 3
  recent_summary_count: 5
  compress_after_chapters: 20
  pre_split_chapters: 50
  failure_switch_threshold: 3
  progress_review_window: 10  # 进度面板审稿质量统计窗口（最近N章）
  # 任务卡质量审核
  task_card_review_enabled: true     # 是否启用任务卡审核
  task_card_review_pass_score: 28    # 审核通过线（满分40）
  max_foreshadow_per_chapter: 2      # 每章伏笔埋入/兑现上限
  foreshadow_injection_style: "guided"  # 伏笔注入语气: guided(引导式) / forced(强制式)
  plateau_threshold: 5       # 平台期检测：评分波动低于此值视为平台期
  plateau_window: 3          # 平台期检测：最近N轮评分
  # 任务卡分批配置
  batch_size_small: 10      # 小批次每批章数
  batch_size_medium: 30     # 中批次每批章数
  batch_size_large: 50      # 大批次每批章数
  batch_bridge_count: 5     # 跨批次上下文桥接引入的任务卡数量

paths:
  data_dir: data
  output_dir: output