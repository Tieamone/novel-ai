model:
  max_tokens: 4096
  # api_region 控制 DashScope 接入节点：
  #   beijing → 华北2（https://dashscope.aliyuncs.com）    【中国大陆用户使用此项】
  #   intl    → 新加坡（https://dashscope-intl.aliyuncs.com）
  #   us      → 美国（https://dashscope-us.aliyuncs.com）
  # 留空则自动探测可用节点
  # 也可在 .env 中直接设置 DASHSCOPE_BASE_URL 覆盖此配置
  api_region: beijing
  author:
    default_model: qwen3.6-flash
    # ⭐ 推荐主模型：128K上下文，快速低成本，有免费试用额度
    # 其他可选试用模型：qwen3.6-plus, qwen3.6-35b-a3b, glm-5.1
  reviewer:
    default_model: qwen3.6-flash
  reader_reviewer:
    default_model: qwen3.6-flash
    enabled: true
    pass_threshold: 75

novel:
  chapter_word_target: 3500
  chapter_word_min: 3000
  chapter_word_max: 4000
  max_retry: 3
  recent_summary_count: 5
  compress_after_chapters: 20
  pre_split_chapters: 50
  failure_switch_threshold: 3
  progress_review_window: 10  # 进度面板审稿质量统计窗口（最近N章）

paths:
  data_dir: data
  output_dir: output