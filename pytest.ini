[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
# 测试文件说明:
# test_model.py           - 基础模型连通性测试
# test_model_discovery.py - 模型发现逻辑测试
# test_model_format.py    - 模型格式验证测试
# test_model_simple.py    - 简单调用测试
# test_model_validation.py- 模型参数验证测试
# test_standard_model.py  - 标准模型接口测试